name: Test, build and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && !github.event.repository.private
        with:
          path: dist

  # main への push（または手動実行）のときだけ GitHub Pages に公開する。
  # 無料プランでは Private のリポジトリから Pages を公開できないため、Private の間はスキップする。
  # Public にしたうえで、Settings > Pages の Source を「GitHub Actions」にすると公開される。
  deploy:
    if: github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
